<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Livbojen — Räddningsspel</title>
<style>
  :root {
    color-scheme: dark;
    --accent: #f4571d;
    --accent-2: #ff7a3d;
    --ink: #eaf6ff;
    --muted: #9fc4d6;
    --line: rgba(255, 255, 255, 0.10);
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }

  /* Soft animated sea backdrop */
  .sea { position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background: radial-gradient(130% 100% at 50% -20%, #164e6f 0%, #0c3346 46%, #061a24 100%); }
  .sea::before, .sea::after { content: ""; position: absolute; left: -30%; right: -30%; bottom: -42%; height: 82%;
    border-radius: 44%; background: rgba(20, 73, 106, 0.55); animation: swell 17s ease-in-out infinite; }
  .sea::after { bottom: -48%; background: rgba(12, 52, 72, 0.5); animation-duration: 25s; animation-direction: reverse; }
  @keyframes swell { 0%, 100% { transform: translateX(-3%) rotate(0deg); } 50% { transform: translateX(3%) rotate(3deg); } }

  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; }

  .brand { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .brand .logo { font-size: 40px; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4)); }
  h1 { margin: 0; font-size: clamp(26px, 6vw, 40px); font-weight: 800; letter-spacing: -0.5px; }
  h1 .accent { color: var(--accent); }
  .tag { margin: 0; color: var(--muted); font-size: 15px; }

  .card { width: min(400px, 92vw); padding: 22px; display: flex; flex-direction: column; gap: 14px;
    background: rgba(9, 40, 56, 0.66); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5); }

  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: 0.2px; }
  input { width: 100%; padding: 13px 14px; border-radius: 12px; font-size: 16px; color: var(--ink);
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); transition: border-color 0.15s, box-shadow 0.15s; }
  input::placeholder { color: #6b93a8; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(244, 87, 29, 0.22); }
  #code { text-transform: uppercase; letter-spacing: 3px; font-weight: 700; }

  .btn { border: none; border-radius: 12px; padding: 13px 14px; font-size: 16px; font-weight: 800; cursor: pointer; color: #fff;
    background: linear-gradient(180deg, var(--accent-2), var(--accent)); box-shadow: 0 8px 20px rgba(244, 87, 29, 0.32);
    transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease; }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
  .btn:active { transform: translateY(0); box-shadow: 0 4px 12px rgba(244, 87, 29, 0.3); }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.35); }
  .btn:disabled { filter: grayscale(0.35); opacity: 0.45; cursor: not-allowed; box-shadow: none; transform: none; }

  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }
  .row .btn { flex: 0 0 auto; }

  .divider { display: flex; align-items: center; gap: 10px; color: #7fa9bd; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .hostlink { text-align: center; color: #a9d6ec; font-size: 14px; font-weight: 600; text-decoration: none; padding-top: 2px; }
  .hostlink:hover { color: #fff; }

  canvas { background: #0e3b52; border-radius: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    width: min(96vw, calc(80vh * 3 / 2)); height: auto; aspect-ratio: 3 / 2; touch-action: none; }

  .hint { font-size: 13px; color: var(--muted); text-align: center; max-width: 900px; }
  kbd { background: rgba(255, 255, 255, 0.08); border-radius: 6px; padding: 1px 7px; border: 1px solid var(--line); font-size: 12px; }
</style>
</head>
<body>
<div class="sea"></div>
<div id="wrap">
  <div class="brand" id="brand">
    <div class="logo">🛟</div>
    <h1>Livb<span class="accent">o</span>jen</h1>
    <p class="tag">Rädda simmarna innan de sjunker</p>
  </div>

  <div id="menu" class="card">
    <div class="field">
      <label for="name">Ditt namn (krävs)</label>
      <input id="name" maxlength="14" placeholder="t.ex. Philip" required autocomplete="off" />
    </div>
    <button id="solo" class="btn">Spela själv</button>
    <div class="divider">eller</div>
    <div class="field">
      <label for="code">Gå med i ett spel</label>
      <div class="row">
        <input id="code" maxlength="6" placeholder="RUMSKOD" autocapitalize="characters" autocomplete="off" />
        <button id="join" class="btn">Gå med</button>
      </div>
    </div>
    <a class="hostlink" href="host.html">Skapa ett eget spel (bli värd) →</a>
  </div>

  <canvas id="game" width="900" height="600" hidden></canvas>
  <div class="hint">
    Dator: <kbd>← ↑ → ↓</kbd> styr · <kbd>Blanksteg</kbd> spurt · <kbd>M</kbd> ljud. &nbsp;Mobil: dra + tryck <b>Spurt</b>.
  </div>
</div>

<script type="module">
  import { createGame } from "./game.js";

  const nameEl = document.getElementById("name");
  const codeEl = document.getElementById("code");
  const menu = document.getElementById("menu");
  const brand = document.getElementById("brand");
  const canvas = document.getElementById("game");

  const params = new URLSearchParams(location.search);
  if (params.get("room")) codeEl.value = params.get("room").toUpperCase();
  try { nameEl.value = localStorage.getItem("livboj-name") || ""; } catch {}

  function name() {
    const n = (nameEl.value || "Spelare").trim().slice(0, 14) || "Spelare";
    try { localStorage.setItem("livboj-name", n); } catch {}
    return n;
  }
  function show(mode, room) {
    menu.hidden = true; brand.hidden = true; canvas.hidden = false;
    window.livboj = createGame(canvas, { mode, name: name(), room });
  }

  const soloBtn = document.getElementById("solo");
  const joinBtn = document.getElementById("join");
  const nameOk = () => (nameEl.value || "").trim().length > 0;
  function updateGate() { const ok = nameOk(); soloBtn.disabled = !ok; joinBtn.disabled = !ok; }
  nameEl.addEventListener("input", updateGate);
  updateGate();

  soloBtn.onclick = () => { if (!nameOk()) { nameEl.focus(); return; } show("solo"); };
  joinBtn.onclick = () => {
    if (!nameOk()) { nameEl.focus(); return; }
    const room = (codeEl.value || "").trim().toUpperCase();
    if (room.length < 3) { codeEl.focus(); return; }
    show("join", room);
  };
  codeEl.addEventListener("keydown", (e) => { if (e.key === "Enter") joinBtn.click(); });
</script>
</body>
</html>
