<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Livbojen — Räddningsspel</title>
<style>
  :root { color-scheme: dark; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #0a2a3a; color: #eaf6ff; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px; box-sizing: border-box; }
  h1 { margin: 0; font-size: clamp(20px, 5vw, 30px); font-weight: 800; }
  h1 span { color: #f4571d; }
  canvas { background: #0e3b52; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    width: min(100%, 96vw); max-height: 80vh; aspect-ratio: 3 / 2; touch-action: none; }
  #menu { background: #0e3b52; border-radius: 16px; padding: 22px; width: min(420px, 92vw); box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    display: flex; flex-direction: column; gap: 12px; }
  label { font-size: 13px; opacity: 0.85; }
  input { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 10px; border: 1px solid #2f7a9e;
    background: #0a2a3a; color: #eaf6ff; font-size: 16px; }
  input::placeholder { color: #6fa6c0; }
  button { border: none; border-radius: 10px; padding: 12px; font-size: 16px; font-weight: 800; cursor: pointer; color: #fff; background: #f4571d; }
  button.secondary { background: #1b5470; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  hr { border: none; border-top: 1px solid #1b5470; margin: 4px 0; width: 100%; }
  a { color: #9fd0e8; text-align: center; font-size: 14px; }
  .hint { font-size: 13px; opacity: 0.75; text-align: center; max-width: 900px; }
  kbd { background: #1b5470; border-radius: 5px; padding: 1px 7px; border: 1px solid #2f7a9e; font-size: 12px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>Rädda med <span>livbojen</span> 🛟</h1>

  <div id="menu">
    <div>
      <label for="name">Ditt namn</label>
      <input id="name" maxlength="14" placeholder="t.ex. Philip" />
    </div>
    <button id="solo">Spela själv</button>
    <hr />
    <div>
      <label for="code">Gå med i ett spel (rumskod)</label>
      <div class="row">
        <input id="code" maxlength="6" placeholder="ABCD" autocapitalize="characters" />
        <button id="join">Gå med</button>
      </div>
    </div>
    <a href="host.html">Skapa ett spel (bli värd) →</a>
  </div>

  <canvas id="game" width="900" height="600" hidden></canvas>
  <div class="hint">
    Dator: <kbd>← ↑ → ↓</kbd> styr &nbsp;·&nbsp; <kbd>Blanksteg</kbd> spurt. &nbsp;·&nbsp; Mobil: dra + tryck <b>Spurt</b>.
  </div>
</div>

<script type="module">
  import { createGame } from "./game.js";

  const nameEl = document.getElementById("name");
  const codeEl = document.getElementById("code");
  const menu = document.getElementById("menu");
  const canvas = document.getElementById("game");

  // Prefill from a shared invite link (?room=ABCD) and a remembered name.
  const params = new URLSearchParams(location.search);
  if (params.get("room")) codeEl.value = params.get("room").toUpperCase();
  try { nameEl.value = localStorage.getItem("livboj-name") || ""; } catch {}

  function name() {
    const n = (nameEl.value || "Spelare").trim().slice(0, 14) || "Spelare";
    try { localStorage.setItem("livboj-name", n); } catch {}
    return n;
  }
  function show(mode, room) {
    menu.hidden = true; canvas.hidden = false;
    createGame(canvas, { mode, name: name(), room });
  }

  document.getElementById("solo").onclick = () => show("solo");
  document.getElementById("join").onclick = () => {
    const room = (codeEl.value || "").trim().toUpperCase();
    if (room.length < 3) { codeEl.focus(); return; }
    show("join", room);
  };
  codeEl.addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("join").click(); });
</script>
</body>
</html>
