<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Livbojen — Räddningsspel</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0a2a3a;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #eaf6ff;
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    box-sizing: border-box;
  }
  h1 {
    margin: 0;
    font-size: clamp(18px, 4vw, 28px);
    letter-spacing: 0.5px;
    font-weight: 800;
  }
  h1 span { color: #f4571d; }
  canvas {
    background: #0e3b52;
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    max-width: 100%;
    max-height: 78vh;
    touch-action: none;
  }
  .hint {
    font-size: 13px;
    opacity: 0.75;
    text-align: center;
  }
  kbd {
    background: #1b5470;
    border-radius: 5px;
    padding: 1px 7px;
    border: 1px solid #2f7a9e;
    font-size: 12px;
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>Rädda med <span>livbojen</span> 🛟</h1>
  <canvas id="game" width="900" height="600"></canvas>
  <div class="hint">
    Rör dig: <kbd>← ↑ → ↓</kbd> &nbsp;·&nbsp; Spurt: <kbd>Blanksteg</kbd> &nbsp;·&nbsp; Fånga simmarna med livbojen för att rädda dem.
  </div>
</div>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  // ---- Level design -------------------------------------------------------
  // Simple, escalating difficulty. Tweak freely — this is the "simple first"
  // knob the whole game reads from.
  const LEVELS = [
    { quota: 5,  spawn: 1300, speed: 22, sink: 9.0, time: 45, maxOnScreen: 4, allowedMisses: 6 },
    { quota: 8,  spawn: 1050, speed: 34, sink: 8.0, time: 45, maxOnScreen: 5, allowedMisses: 5 },
    { quota: 12, spawn: 880,  speed: 48, sink: 7.0, time: 45, maxOnScreen: 6, allowedMisses: 4 },
    { quota: 16, spawn: 720,  speed: 64, sink: 6.0, time: 42, maxOnScreen: 7, allowedMisses: 4 },
    { quota: 20, spawn: 560,  speed: 84, sink: 5.2, time: 40, maxOnScreen: 8, allowedMisses: 3 },
  ];

  // ---- State --------------------------------------------------------------
  const State = { START: "start", INTRO: "intro", PLAY: "play", CLEARED: "cleared", OVER: "over", WIN: "win" };
  let state = State.START;

  const player = { x: W / 2, y: H / 2, r: 30, speed: 300 };
  let levelIndex = 0;
  let score = 0;
  let caught = 0;
  let missed = 0;
  let timeLeft = 0;
  let spawnTimer = 0;
  let introTimer = 0;
  let swimmers = [];
  let splashes = [];
  let dashCooldown = 0;
  let dashActive = 0;

  // ---- Input --------------------------------------------------------------
  const keys = Object.create(null);
  const MOVE_KEYS = new Set(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," ","Space"]);
  addEventListener("keydown", (e) => {
    const k = e.key === " " ? "Space" : e.key;
    keys[k] = true;
    if (MOVE_KEYS.has(e.key) || MOVE_KEYS.has(k)) e.preventDefault();
    if ((k === "Space") && (state === State.START || state === State.OVER || state === State.WIN)) startGame();
    if ((k === "Space") && state === State.INTRO) beginLevel();
    if ((k === "Space") && state === State.CLEARED) nextLevel();
  }, { passive: false });
  addEventListener("keyup", (e) => {
    const k = e.key === " " ? "Space" : e.key;
    keys[k] = false;
  });

  // ---- Flow ---------------------------------------------------------------
  function startGame() {
    levelIndex = 0;
    score = 0;
    showIntro();
  }
  function showIntro() {
    state = State.INTRO;
    introTimer = 2.2;
    player.x = W / 2; player.y = H / 2;
  }
  function beginLevel() {
    const L = LEVELS[levelIndex];
    state = State.PLAY;
    caught = 0;
    missed = 0;
    timeLeft = L.time;
    spawnTimer = 0.4;
    swimmers = [];
    splashes = [];
    dashCooldown = 0;
    dashActive = 0;
  }
  function nextLevel() {
    levelIndex++;
    if (levelIndex >= LEVELS.length) { state = State.WIN; return; }
    showIntro();
  }

  // ---- Spawning -----------------------------------------------------------
  function spawnSwimmer() {
    const L = LEVELS[levelIndex];
    const margin = 60;
    const x = margin + Math.random() * (W - margin * 2);
    const y = margin + Math.random() * (H - margin * 2);
    const ang = Math.random() * Math.PI * 2;
    swimmers.push({
      x, y, r: 16,
      vx: Math.cos(ang) * L.speed,
      vy: Math.sin(ang) * L.speed,
      life: L.sink,
      maxLife: L.sink,
      bob: Math.random() * Math.PI * 2,
    });
  }

  // ---- Update -------------------------------------------------------------
  function update(dt) {
    if (state === State.INTRO) {
      introTimer -= dt;
      if (introTimer <= 0) beginLevel();
      return;
    }
    if (state !== State.PLAY) return;

    const L = LEVELS[levelIndex];

    // Player movement
    let dx = 0, dy = 0;
    if (keys.ArrowLeft) dx -= 1;
    if (keys.ArrowRight) dx += 1;
    if (keys.ArrowUp) dy -= 1;
    if (keys.ArrowDown) dy += 1;
    if (dx || dy) {
      const len = Math.hypot(dx, dy) || 1;
      dx /= len; dy /= len;
    }
    dashCooldown = Math.max(0, dashCooldown - dt);
    dashActive = Math.max(0, dashActive - dt);
    if (keys.Space && dashCooldown === 0) {
      dashActive = 0.18;
      dashCooldown = 0.9;
    }
    const speed = player.speed * (dashActive > 0 ? 2.1 : 1);
    player.x += dx * speed * dt;
    player.y += dy * speed * dt;
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));
    player.y = Math.max(player.r, Math.min(H - player.r, player.y));

    // Timer
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; state = State.OVER; return; }

    // Spawn
    spawnTimer -= dt;
    if (spawnTimer <= 0 && swimmers.length < L.maxOnScreen) {
      spawnSwimmer();
      spawnTimer = L.spawn / 1000;
    }

    // Swimmers
    for (let i = swimmers.length - 1; i >= 0; i--) {
      const s = swimmers[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.bob += dt * 4;
      if (s.x < s.r || s.x > W - s.r) { s.vx *= -1; s.x = Math.max(s.r, Math.min(W - s.r, s.x)); }
      if (s.y < s.r || s.y > H - s.r) { s.vy *= -1; s.y = Math.max(s.r, Math.min(H - s.r, s.y)); }
      s.life -= dt;

      // Rescue?
      const d = Math.hypot(s.x - player.x, s.y - player.y);
      if (d < player.r + s.r) {
        caught++;
        score += 10 + levelIndex * 5;
        splashes.push({ x: s.x, y: s.y, t: 0, good: true });
        swimmers.splice(i, 1);
        if (caught >= L.quota) { state = State.CLEARED; return; }
        continue;
      }
      // Sank?
      if (s.life <= 0) {
        missed++;
        splashes.push({ x: s.x, y: s.y, t: 0, good: false });
        swimmers.splice(i, 1);
        if (missed > L.allowedMisses) { state = State.OVER; return; }
      }
    }

    // Splashes
    for (let i = splashes.length - 1; i >= 0; i--) {
      splashes[i].t += dt;
      if (splashes[i].t > 0.6) splashes.splice(i, 1);
    }
  }

  // ---- Drawing ------------------------------------------------------------
  let waveT = 0;

  function drawWater() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#12496a");
    g.addColorStop(1, "#0c2f45");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(255,255,255,0.06)";
    ctx.lineWidth = 2;
    for (let row = 0; row < 7; row++) {
      const y0 = (row + 0.5) * (H / 7);
      ctx.beginPath();
      for (let x = 0; x <= W; x += 20) {
        const y = y0 + Math.sin((x * 0.02) + waveT + row) * 6;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  function drawLivboj(x, y, r, glow) {
    ctx.save();
    ctx.translate(x, y);
    if (glow) {
      ctx.shadowColor = "rgba(255,255,255,0.9)";
      ctx.shadowBlur = 22;
    }
    // Orange ring (donut via evenodd)
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.arc(0, 0, r * 0.55, 0, Math.PI * 2, true);
    ctx.fillStyle = "#f4571d";
    ctx.fill("evenodd");
    ctx.shadowBlur = 0;
    // Four white bands
    ctx.fillStyle = "#f4f4f0";
    for (let i = 0; i < 4; i++) {
      ctx.save();
      ctx.rotate(i * Math.PI / 2 + Math.PI / 4);
      ctx.beginPath();
      ctx.arc(0, 0, r, -0.32, 0.32);
      ctx.arc(0, 0, r * 0.55, 0.32, -0.32, true);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    // Thin outlines
    ctx.strokeStyle = "rgba(0,0,0,0.28)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.55, 0, Math.PI * 2); ctx.stroke();
    // Rope knots around outer edge
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = 3;
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * r, Math.sin(a) * r, r * 0.11, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawSwimmer(s) {
    const bobY = Math.sin(s.bob) * 2;
    // sink-time ring (green -> red)
    const frac = Math.max(0, s.life / s.maxLife);
    const hue = 120 * frac;
    ctx.strokeStyle = `hsl(${hue}, 80%, 55%)`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(s.x, s.y + bobY, s.r + 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
    ctx.stroke();
    // arms
    ctx.strokeStyle = "#f2c8a0";
    ctx.lineWidth = 4;
    const wave = Math.sin(s.bob * 1.5) * 4;
    ctx.beginPath();
    ctx.moveTo(s.x - s.r * 0.4, s.y + bobY);
    ctx.lineTo(s.x - s.r * 1.1, s.y + bobY - 6 + wave);
    ctx.moveTo(s.x + s.r * 0.4, s.y + bobY);
    ctx.lineTo(s.x + s.r * 1.1, s.y + bobY - 6 - wave);
    ctx.stroke();
    // head
    ctx.fillStyle = "#f7d3ad";
    ctx.beginPath();
    ctx.arc(s.x, s.y + bobY, s.r * 0.75, 0, Math.PI * 2);
    ctx.fill();
    // hair
    ctx.fillStyle = "#4a3423";
    ctx.beginPath();
    ctx.arc(s.x, s.y + bobY - 2, s.r * 0.75, Math.PI, Math.PI * 2);
    ctx.fill();
    // worried mouth
    ctx.strokeStyle = "#7a4a3a";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(s.x, s.y + bobY + 5, 3, 0, Math.PI, true);
    ctx.stroke();
  }

  function drawSplash(sp) {
    const p = sp.t / 0.6;
    ctx.strokeStyle = sp.good ? `rgba(120,230,160,${1 - p})` : `rgba(230,120,120,${1 - p})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, 6 + p * 26, 0, Math.PI * 2);
    ctx.stroke();
  }

  function panel(lines, sub) {
    ctx.fillStyle = "rgba(4,20,30,0.62)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#eaf6ff";
    ctx.font = "800 44px system-ui, sans-serif";
    let y = H / 2 - (lines.length - 1) * 30 - (sub ? 26 : 0);
    for (const line of lines) { ctx.fillText(line, W / 2, y); y += 56; }
    if (sub) {
      ctx.font = "500 20px system-ui, sans-serif";
      ctx.fillStyle = "#bfe0f2";
      ctx.fillText(sub, W / 2, y + 6);
    }
  }

  function drawHUD() {
    const L = LEVELS[levelIndex];
    ctx.textAlign = "left";
    ctx.font = "700 20px system-ui, sans-serif";
    ctx.fillStyle = "#eaf6ff";
    ctx.fillText(`Poäng ${score}`, 18, 30);
    ctx.fillText(`Nivå ${levelIndex + 1}/5`, 18, 56);
    ctx.textAlign = "center";
    ctx.fillText(`Räddade ${caught} / ${L.quota}`, W / 2, 30);
    ctx.textAlign = "right";
    const t = Math.ceil(timeLeft);
    ctx.fillStyle = t <= 10 ? "#ff8a6a" : "#eaf6ff";
    ctx.fillText(`Tid ${t}s`, W - 18, 30);
    ctx.fillStyle = "#ffd7c7";
    ctx.fillText(`Missade ${missed}/${L.allowedMisses}`, W - 18, 56);
    // dash meter
    ctx.textAlign = "left";
    ctx.fillStyle = "#bfe0f2";
    ctx.font = "600 14px system-ui, sans-serif";
    ctx.fillText(dashCooldown === 0 ? "Spurt redo (blanksteg)" : "Spurt…", 18, H - 16);
  }

  function render() {
    drawWater();

    if (state === State.PLAY || state === State.CLEARED || state === State.OVER) {
      for (const s of swimmers) drawSwimmer(s);
      for (const sp of splashes) drawSplash(sp);
      drawLivboj(player.x, player.y, player.r, dashActive > 0);
      drawHUD();
    }

    if (state === State.START) {
      drawLivboj(W / 2, H / 2 - 40, 46, true);
      panel(["Livbojen"], "");
      ctx.textAlign = "center";
      ctx.font = "500 22px system-ui, sans-serif";
      ctx.fillStyle = "#bfe0f2";
      ctx.fillText("Rädda simmarna innan de sjunker.", W / 2, H / 2 + 60);
      ctx.fillText("Rör dig med pilarna · Spurta med blanksteg", W / 2, H / 2 + 92);
      ctx.font = "800 24px system-ui, sans-serif";
      ctx.fillStyle = "#f4571d";
      ctx.fillText("Tryck på blanksteg för att börja", W / 2, H / 2 + 140);
    } else if (state === State.INTRO) {
      const L = LEVELS[levelIndex];
      panel([`Nivå ${levelIndex + 1}`], `Rädda ${L.quota} simmare · låt inte ${L.allowedMisses + 1} sjunka`);
      ctx.textAlign = "center";
      ctx.font = "700 20px system-ui, sans-serif";
      ctx.fillStyle = "#f4571d";
      ctx.fillText("Tryck på blanksteg för att hoppa över", W / 2, H / 2 + 70);
    } else if (state === State.CLEARED) {
      panel(["Nivå avklarad!"], `Poäng ${score}`);
      ctx.textAlign = "center";
      ctx.font = "800 24px system-ui, sans-serif";
      ctx.fillStyle = "#f4571d";
      ctx.fillText("Tryck på blanksteg för nästa nivå", W / 2, H / 2 + 70);
    } else if (state === State.OVER) {
      panel(["Spelet är slut"], `Din totalpoäng blev ${score}`);
      ctx.textAlign = "center";
      ctx.font = "800 24px system-ui, sans-serif";
      ctx.fillStyle = "#f4571d";
      ctx.fillText("Tryck på blanksteg för att försöka igen", W / 2, H / 2 + 70);
    } else if (state === State.WIN) {
      panel(["Du vann! 🛟", "Alla 5 nivåer avklarade"], `Slutpoäng ${score}`);
      ctx.textAlign = "center";
      ctx.font = "800 24px system-ui, sans-serif";
      ctx.fillStyle = "#f4571d";
      ctx.fillText("Tryck på blanksteg för att spela igen", W / 2, H / 2 + 84);
    }
  }

  // ---- Loop ---------------------------------------------------------------
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05; // clamp after tab switches
    waveT += dt;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
