<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0c3346" />
<meta name="color-scheme" content="dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Livbojen" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Livbojen — Värd</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<style>
  :root {
    color-scheme: dark;
    --accent: #f4571d; --accent-2: #ff7a3d; --ink: #eaf6ff; --muted: #9fc4d6; --line: rgba(255, 255, 255, 0.10);
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .sea { position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background: radial-gradient(130% 100% at 50% -20%, #164e6f 0%, #0c3346 46%, #061a24 100%); }
  .sea::before, .sea::after { content: ""; position: absolute; left: -30%; right: -30%; bottom: -42%; height: 82%;
    border-radius: 44%; background: rgba(20, 73, 106, 0.55); animation: swell 17s ease-in-out infinite; }
  .sea::after { bottom: -48%; background: rgba(12, 52, 72, 0.5); animation-duration: 25s; animation-direction: reverse; }
  @keyframes swell { 0%, 100% { transform: translateX(-3%) rotate(0deg); } 50% { transform: translateX(3%) rotate(3deg); } }

  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; }
  .brand { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .brand .logo { font-size: 34px; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4)); }
  h1 { margin: 0; font-size: clamp(22px, 5vw, 32px); font-weight: 800; letter-spacing: -0.5px; }
  h1 .accent { color: var(--accent); }

  .card { width: min(440px, 92vw); padding: 22px; display: flex; flex-direction: column; gap: 16px;
    background: rgba(9, 40, 56, 0.66); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5); max-height: 88vh; overflow: auto;
    flex: 0 1 auto; min-height: 0; overscroll-behavior: contain; }
  .brand { flex: none; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: 0.2px; }
  input { width: 100%; padding: 13px 14px; border-radius: 12px; font-size: 16px; color: var(--ink);
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); transition: border-color 0.15s, box-shadow 0.15s; }
  input::placeholder { color: #6b93a8; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(244, 87, 29, 0.22); }

  .btn { border: none; border-radius: 12px; padding: 13px 14px; font-size: 16px; font-weight: 800; cursor: pointer; color: #fff;
    background: linear-gradient(180deg, var(--accent-2), var(--accent)); box-shadow: 0 8px 20px rgba(244, 87, 29, 0.32);
    transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease; }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.35); }
  .btn:disabled { filter: grayscale(0.35); opacity: 0.45; cursor: not-allowed; box-shadow: none; transform: none; }
  .btn.ghost { background: rgba(255, 255, 255, 0.07); box-shadow: none; color: var(--ink); font-size: 13px; padding: 9px 12px; }

  .backlink { text-align: center; color: #a9d6ec; font-size: 14px; font-weight: 600; text-decoration: none; }
  .backlink:hover { color: #fff; }

  .codewrap { display: flex; gap: 8px; align-items: stretch; }
  .code { flex: 1; font: 800 38px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 8px; color: var(--accent);
    text-align: center; background: rgba(0, 0, 0, 0.28); border-radius: 14px; padding: 12px 6px; }
  .code.small { font-size: 22px; letter-spacing: 4px; }

  .roster { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .roster li { background: rgba(255, 255, 255, 0.04); border-radius: 10px; padding: 9px 12px; display: flex; justify-content: space-between; align-items: center; }
  .roster .you { color: #ffd7c7; font-weight: 700; }
  .roster .tag { font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; }

  .board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .board li { background: rgba(255, 255, 255, 0.04); border-radius: 10px; padding: 7px 11px; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
  .board .sc { color: var(--accent); font-weight: 800; white-space: nowrap; }
  .board li { flex-direction: column; align-items: stretch; gap: 5px; }
  .rowhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .members { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: 11.5px; color: #cfe6f3; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; }
  .boardhead { display: flex; justify-content: space-between; align-items: baseline; }
  .clear { background: none; border: none; color: #a9d6ec; font-size: 12px; font-weight: 700; padding: 0; width: auto; cursor: pointer; }
  .clear:hover { color: #fff; }
  .muted { font-size: 12.5px; color: var(--muted); }

  canvas { background: #0e3b52; border-radius: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }

  /* ---- Safe areas, play mode, fullscreen (same block in index.html and host.html) ---- */
  :root {
    --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px);
    --gx: calc(var(--sal) + var(--sar) + 12px); --gy: calc(var(--sat) + var(--sab) + 12px); /* play-mode margins */
  }
  html, body { overscroll-behavior: none; }
  #wrap { padding: max(16px, var(--sat)) max(16px, var(--sar)) max(16px, var(--sab)) max(16px, var(--sal)); }
  button, .btn, .tab, a { touch-action: manipulation; }
  .stage { position: relative; flex: none; width: min(96vw, calc(80vh * 2)); container-type: inline-size; }
  .stage canvas { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  /* While a game shows: the canvas as big as the window allows, letterboxed at 2:1 (centred: #wrap) */
  body.playing #wrap { gap: 0; padding: calc(var(--sat) + 6px) calc(var(--sar) + 6px) calc(var(--sab) + 6px) calc(var(--sal) + 6px); }
  body.playing .brand, body.playing .hint, body.playing .homehint { display: none !important; }
  body.playing .stage {
    width: min(calc(100vw - var(--gx)), calc((100vh - var(--gy)) * 2));
    width: min(calc(100dvw - var(--gx)), calc((100dvh - var(--gy)) * 2));
  }
  /* Fullscreen: the whole page, so the sea backdrop fills the band a 2:1 field leaves on a 16:9 screen */
  /* Fullscreen toggle: a round glass button right of the canvas-drawn mute button, in the HUD's
     button family (hud.js). --u is one HUD unit in css px — hud.js: u = min(1.4, max(1, 0.92 / s)),
     s = canvas css px per logical px, so u*s = min(1.4 s, max(s, 0.92px)); 0.08333% of the stage width = s (1200 wide).
     Mute: r 20u at 12u from the bottom-left corner; this button: 40u wide, 12u gap, same row.
     (Margins in % are taken from the width, even vertical ones.) A ::before widens the touch target. */
  .fsbtn { --u: min(0.11667%, max(0.08333%, 0.92px)); position: absolute; left: 0; bottom: 0; margin: 0 0 calc(12 * var(--u)) calc(64 * var(--u));
    width: calc(40 * var(--u)); height: auto; aspect-ratio: 1; display: grid; place-items: center; padding: 0; border-radius: 50%; cursor: pointer; color: #fff;
    background: linear-gradient(180deg, rgba(18, 56, 78, 0.74), rgba(5, 24, 37, 0.82)); border: 1px solid rgba(190, 230, 250, 0.3);
    box-shadow: 0 3px 12px rgba(0, 8, 16, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12); -webkit-tap-highlight-color: transparent;
    transition: transform 0.12s, border-color 0.12s, background 0.12s; }
  .fsbtn::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; }
  .fsbtn:hover, .fsbtn:focus-visible { outline: none; border-color: rgba(220, 240, 255, 0.55); transform: scale(1.05);
    background: linear-gradient(180deg, rgba(24, 66, 90, 0.86), rgba(6, 28, 42, 0.9)); }
  .fsbtn:active { transform: scale(0.92); }
  .fsbtn svg { width: 50%; height: 50%; }
  /* a tall window: the canvas is width-limited and small, with room below it — the button goes there */
  @media (max-aspect-ratio: 1/1) { .fsbtn { bottom: auto; top: calc(100% + 10px); margin: 0; width: 44px; } }
  /* "F helskärm": a short-lived chip beside the fullscreen button when a game starts on a desktop that is not
     fullscreen (game.js initChrome; once per session). On the beach row, never over the water; it takes no clicks.
     Sized like the HUD: --uc is --u above in container units (cqw: % of the stage width, font sizes included). */
  .fshint { --uc: min(0.11667cqw, max(0.08333cqw, 0.92px)); position: absolute; left: 0; bottom: 0; margin: 0 0 calc(18 * var(--uc)) calc(116 * var(--uc));
    display: flex; align-items: center; gap: calc(7 * var(--uc)); padding: calc(4 * var(--uc)) calc(12 * var(--uc)) calc(4 * var(--uc)) calc(4 * var(--uc));
    border-radius: 999px; pointer-events: none; white-space: nowrap; color: #f2f9ff; font: 600 calc(14 * var(--uc)) / 1.2 "Livboj", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, rgba(18, 56, 78, 0.8), rgba(5, 24, 37, 0.86)); border: 1px solid rgba(190, 230, 250, 0.3);
    box-shadow: 0 3px 12px rgba(0, 8, 16, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12); opacity: 0; transform: translateX(-6px); transition: opacity 0.35s, transform 0.35s; }
  .fshint.on { opacity: 1; transform: none; }
  .fshint b { display: grid; place-items: center; min-width: 1.6em; height: 1.6em; border-radius: 0.45em; font-weight: 700; color: #fff;
    background: linear-gradient(180deg, #ff7a3d, #e2470f); box-shadow: 0 2px 6px rgba(244, 87, 29, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
  @media (max-aspect-ratio: 1/1) { .fshint { bottom: auto; top: calc(100% + 18px); margin: 0 0 0 54px; font-size: 13px; padding: 4px 11px 4px 5px; } }
  /* "Vrid mobilen" over the game on a phone held upright (the game runs on underneath) — the HUD's glass card */
  .rotatecard { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 5px;
    padding: 16px 22px 14px; border-radius: 22px; text-align: center; cursor: pointer; width: max-content; max-width: 86%;
    background: linear-gradient(180deg, rgba(18, 56, 78, 0.94), rgba(5, 24, 37, 0.96)); border: 1px solid rgba(190, 230, 250, 0.24);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.12); color: var(--ink);
    font-family: "Livboj", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  .rotatecard svg { width: 44px; height: 44px; color: var(--accent); animation: rot 1.8s ease-in-out infinite; }
  .rotatecard b { font-size: 17px; font-weight: 600; }
  .rotatecard span { font-size: 13px; color: #cfe6f3; }
  .rotatecard small { margin-top: 4px; padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase;
    color: #fff; background: linear-gradient(180deg, #ff7a3d, #e2470f); box-shadow: 0 2px 8px rgba(244, 87, 29, 0.45); }
  @keyframes rot { 0%, 20% { transform: rotate(0); } 50%, 70% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
</style>
</head>
<body>
<div class="sea"></div>
<div id="wrap">
  <div class="brand" id="brand">
    <div class="logo">🛟</div>
    <h1>Livb<span class="accent">o</span>jen — värd</h1>
  </div>

  <div id="setup" class="card">
    <div class="field">
      <label for="name">Ditt namn (krävs)</label>
      <input id="name" maxlength="14" placeholder="t.ex. Philip" required autocomplete="off" />
    </div>
    <div class="field">
      <label for="team">Lagnamn (valfritt — visas i topplistan)</label>
      <input id="team" maxlength="20" placeholder="t.ex. Kundtjänst" autocomplete="off" />
    </div>
    <button id="create" class="btn" disabled>Skapa lobby</button>
    <a class="backlink" href="index.html">← Tillbaka</a>
  </div>

  <div id="lobby" class="card" hidden>
    <div class="field">
      <label>Rumskod — dela med dina vänner</label>
      <div class="codewrap">
        <div class="code" id="codeText">----</div>
        <button class="btn ghost" id="copyCode">Kopiera</button>
      </div>
    </div>
    <div class="field">
      <label>Inbjudningslänk</label>
      <div class="codewrap">
        <div class="code small" id="shareLine" style="letter-spacing:0;font-size:13px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:12px">—</div>
        <button class="btn ghost" id="copyLink">Kopiera</button>
      </div>
    </div>
    <div class="field">
      <label>Spelare i lobbyn (upp till 12)</label>
      <ul class="roster" id="roster"></ul>
      <div class="muted">Spelare dyker upp här när de ansluter — det kan ta några sekunder.</div>
      <div class="muted" id="net" style="margin-top:6px"></div>
    </div>
    <div class="field">
      <div class="boardhead">
        <label id="boardLabel">🏆 Topplista</label>
        <span class="muted" id="boardSource">hämtar…</span>
      </div>
      <ol class="board" id="board"><li class="empty">Inga resultat än</li></ol>
    </div>
    <button id="start" class="btn">Starta spelet</button>
  </div>

  <div id="stage" class="stage" hidden>
    <canvas id="game" width="1200" height="600"></canvas>
    <button id="fsBtn" class="fsbtn" type="button" aria-label="Helskärm" title="Helskärm (F)" hidden></button>
    <div id="rotateCard" class="rotatecard" role="button" tabindex="0" aria-label="Stäng tipset om att vrida mobilen" hidden>
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="15" y="6" width="18" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><path d="M21 37h6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      <b>Vrid mobilen</b>
      <span>Spelplanen blir mycket större på tvären</span>
      <small>Tryck för att stänga</small>
    </div>
  </div>
</div>

<script type="module">
  import { loadGame, watchUpdates } from "./boot.js";
  // Always the latest build (see boot.js). Before a lobby exists a new build
  // reloads silently; with a room open the host gets a banner instead, since
  // reloading would end the round for everyone.
  const { createGame, initChrome, build } = await loadGame();

  const nameEl = document.getElementById("name");
  const teamEl = document.getElementById("team");
  const boardSourceEl = document.getElementById("boardSource");
  const setup = document.getElementById("setup");
  const lobby = document.getElementById("lobby");
  const brand = document.getElementById("brand");
  const canvas = document.getElementById("game");
  const stage = document.getElementById("stage");
  // fullscreen button + F, "Vrid mobilen", iOS viewport fixes (game.js)
  const chrome = initChrome ? initChrome({ stage, fsBtn: document.getElementById("fsBtn"), rotateCard: document.getElementById("rotateCard") }) : null;
  function setPlaying(on) { stage.hidden = !on; document.body.classList.toggle("playing", on); if (chrome) chrome.setPlaying(on); }
  const codeText = document.getElementById("codeText");
  const rosterEl = document.getElementById("roster");
  const shareLine = document.getElementById("shareLine");
  const boardEl = document.getElementById("board");

  // restore the saved name, but never over something typed while the code was loading
  try { if (!nameEl.value) nameEl.value = localStorage.getItem("livboj-name") || ""; } catch {}
  try { if (!teamEl.value) teamEl.value = localStorage.getItem("livboj-team") || ""; } catch {}

  const ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const params = new URLSearchParams(location.search);
  let room = (params.get("room") || "").toUpperCase();
  if (!/^[A-Z0-9]{3,6}$/.test(room)) {
    room = Array.from({ length: 3 }, () => ALPHABET[(Math.random() * ALPHABET.length) | 0]).join(""); // 3 chars: ~30k codes, plenty for an office
    const u = new URL(location.href); u.searchParams.set("room", room); history.replaceState(null, "", u);
  }
  let joinUrl = new URL("index.html", location.href); joinUrl.searchParams.set("room", room);
  const relayParam = params.get("relay"); if (relayParam) joinUrl.searchParams.set("relay", relayParam); // joiners must use the same transport

  let api = null;
  watchUpdates(build, { isIdle: () => !api }); // reload keeps ?room=, so the same code works after an update

  function renderRoster(list) {
    rosterEl.innerHTML = "";
    if (!list || !list.length) { rosterEl.innerHTML = '<li class="empty">Väntar på spelare…</li>'; return; }
    for (const p of list) {
      const li = document.createElement("li");
      const n = document.createElement("span"); n.textContent = p.name; if (p.you) n.className = "you";
      const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = p.you ? "Värd (du)" : "Ansluten";
      li.append(n, tag); rosterEl.appendChild(li);
    }
  }
  function renderBoard(list, source) {
    boardSourceEl.textContent = source === "global" ? "global · alla spel" : "lokal kopia · reläservern nås inte";
    boardEl.innerHTML = "";
    list = (list || []).filter((e) => e.n >= 2); // the lobby is about a team game: teams only
    if (!list.length) { boardEl.innerHTML = '<li class="empty">Inga lagspel än</li>'; return; }
    list.slice(0, 10).forEach((e, i) => {
      const li = document.createElement("li");
      const head = document.createElement("div"); head.className = "rowhead";
      const left = document.createElement("span"); const d = new Date(e.ts);
      left.textContent = `${i + 1}. ${e.team || "Lag"} · ${e.n} spelare · Nivå ${e.level} · ${d.getDate()}/${d.getMonth() + 1}`;
      const sc = document.createElement("span"); sc.className = "sc"; sc.textContent = `${e.score} p`;
      head.append(left, sc);
      const noSplit = (e.players || []).every((pp) => typeof pp === "string" || !pp.score); // old rows: total only
      const mem = document.createElement("div"); mem.className = "members"; // every member, wrapping
      for (const pp of e.players || []) { const c = document.createElement("span"); c.className = "chip"; c.textContent = typeof pp === "string" ? pp : (noSplit ? pp.name : `${pp.name} ${pp.score}p`); mem.appendChild(c); }
      li.append(head, mem); boardEl.appendChild(li);
    });
  }
  async function copy(text, btn) {
    try { await navigator.clipboard.writeText(text); const t = btn.textContent; btn.textContent = "Kopierat!"; setTimeout(() => (btn.textContent = t), 1200); } catch {}
  }
  document.getElementById("copyCode").onclick = (e) => copy(room, e.currentTarget);
  document.getElementById("copyLink").onclick = (e) => copy(joinUrl.href, e.currentTarget);

  const createBtn = document.getElementById("create");
  const nameOk = () => (nameEl.value || "").trim().length > 0;
  function updateGate() { createBtn.disabled = !nameOk(); }
  nameEl.addEventListener("input", updateGate);
  updateGate();

  createBtn.onclick = () => {
    if (!nameOk()) { nameEl.focus(); return; }
    const name = (nameEl.value || "").trim().slice(0, 14);
    const team = (teamEl.value || "").trim().slice(0, 20);
    try { localStorage.setItem("livboj-name", name); localStorage.setItem("livboj-team", team); } catch {}
    codeText.textContent = room;
    shareLine.textContent = joinUrl.href;
    if (team) { const t = document.createElement("div"); t.className = "muted"; t.textContent = `Lag: ${team}`; t.style.textAlign = "center"; lobby.insertBefore(t, lobby.firstChild); }
    setup.hidden = true; lobby.hidden = false;
    renderRoster([]);
    api = window.livboj = createGame(canvas, {
      mode: "host", name, team, room,
      cbs: {
        onRoster: renderRoster,
        onBoard: renderBoard,
        onPhase: (phase) => {
          const inLobby = phase === "lobby";
          lobby.hidden = !inLobby;
          brand.hidden = !inLobby;
          setPlaying(!inLobby);
        },
      },
    });
  };
  document.getElementById("start").onclick = () => { if (api) api.hostStart(); };
  // live network diagnostics in the lobby (signaling / STUN / TURN / relay)
  const netEl = document.getElementById("net");
  setInterval(() => {
    if (!api || !api.netSummary) return;
    const s = api.netSummary(); netEl.textContent = s; netEl.style.color = /blockera|kan inte/.test(s) ? "#ff8a6a" : "";
    // stamp the resolved signaling strategy on the invite link so joiners use the same one
    const sig = api.signaling && api.signaling();
    if (sig && joinUrl.searchParams.get("sig") !== sig) { joinUrl.searchParams.set("sig", sig); shareLine.textContent = joinUrl.href; }
  }, 1000);
</script>
</body>
</html>
